<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#121315">
<title>ТОР кабинет</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="a/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ТОР кабинет">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="a/f/Manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="a/f/CormorantGaramond-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Cormorant Garamond';font-weight:300 700;font-display:swap;src:url(a/f/CormorantGaramond-cyrillic.woff2) format('woff2');unicode-range:U+0400-045F,U+2116}
@font-face{font-family:'Cormorant Garamond';font-weight:300 700;font-display:swap;src:url(a/f/CormorantGaramond-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:'Manrope';font-weight:200 800;font-display:swap;src:url(a/f/Manrope-cyrillic.woff2) format('woff2');unicode-range:U+0400-045F,U+2116}
@font-face{font-family:'Manrope';font-weight:200 800;font-display:swap;src:url(a/f/Manrope-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2212}
:root{--ink:#15171A;--ink2:#2B2E33;--mut:#62676F;--line:#E2E4E8;--stone:#F1F2F4;--stone2:#F7F8F9;--night:#121315;--ok:#2F6B3A;--okbg:#E8F1EA;--wait:#8A5A12;--waitbg:#FBF1DF;
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'Manrope',Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--stone);color:var(--ink);font:15px/1.45 var(--sans)}
body{min-height:100vh}
/* оболочка показа */
.top{max-width:980px;margin:0 auto;padding:18px 18px 10px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand img{width:34px;height:34px}
.brand b{font:600 20px/1 var(--serif);letter-spacing:.01em}
.brand small{display:block;font:500 11px/1.2 var(--sans);color:var(--mut);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.role{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.role button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font:600 13px var(--sans);color:var(--mut);cursor:pointer}
.role button.on{background:var(--ink);color:#fff}
.note{max-width:980px;margin:0 auto;padding:0 18px 14px;font-size:12.5px;color:var(--mut)}
.phone{width:390px;max-width:100%;height:800px;max-height:calc(100vh - 120px);min-height:580px;margin:0 auto 28px;background:#fff;border-radius:44px;border:10px solid var(--night);overflow:hidden;display:flex;flex-direction:column;position:relative}
@media (max-width:480px),(display-mode:standalone){html,body{background:#fff}.top,.note{display:none}.phone{width:100%;border:0;border-radius:0;height:100vh;height:100dvh;max-height:none;min-height:0;margin:0}}
/* приложение */
.bar{height:calc(56px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);display:flex;align-items:center;gap:10px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line);flex:none;background:#fff}
.bar .logo{width:26px;height:26px}
.bar .t{font:600 20px/1.1 var(--serif);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-feature-settings:"lnum"}
.back{border:0;background:none;font-size:26px;line-height:1;padding:2px 6px 4px 0;cursor:pointer;color:var(--ink)}
.bell{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;position:relative}
.bell svg{width:16px;height:16px}
.ex{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;cursor:pointer}.ex svg{width:16px;height:16px}
.ver{text-align:center;font-size:12px;color:var(--mut);margin-top:auto;padding-top:18px}.ver a{color:var(--ink);font-weight:600}
.bell i{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:#E5484D}
.scr{flex:1;overflow-y:auto;padding:16px}
.tabs{display:flex;border-top:1px solid var(--line);flex:none;background:#fff;padding-bottom:env(safe-area-inset-bottom)}
.tabs:empty{display:none}
.tabs button{flex:1;min-width:0;border:0;background:none;padding:9px 0 10px;font:600 10.5px var(--sans);color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;white-space:nowrap}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--ink)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.eb{font:600 11px/1.3 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:20px 0 10px}
.serif{font-family:var(--serif);font-feature-settings:"lnum"}
.card{border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;background:#fff}
.click{cursor:pointer}.click:active{background:var(--stone2)}
.row{display:flex;align-items:center;gap:12px}
.mut{color:var(--mut);font-size:13px}
.hero{position:relative;border-radius:20px;overflow:hidden;color:#fff;margin-bottom:12px;aspect-ratio:4/3.3;background:#333}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,19,21,.15) 0%,rgba(18,19,21,.1) 35%,rgba(18,19,21,.85) 100%)}
.hero .in{position:absolute;left:16px;right:16px;bottom:14px;z-index:1}
.hero .pct{font:500 64px/0.9 var(--serif);font-feature-settings:"lnum"}
.hero .pct sup{font-size:28px;vertical-align:28px;margin-left:2px}
.hero .lbl{font:600 11px/1.3 var(--sans);letter-spacing:.12em;text-transform:uppercase;opacity:.8;margin-bottom:4px}
.hero .bar2{height:3px;background:rgba(255,255,255,.25);border-radius:2px;margin:10px 0 8px;overflow:hidden}
.hero .bar2 i{display:block;height:100%;background:#fff}
.hero .sub{font-size:13px;opacity:.9}
.prog{height:3px;background:var(--stone);border-radius:2px;overflow:hidden;margin:8px 0 2px}
.prog i{display:block;height:100%;background:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--sans);padding:6px 9px;border-radius:999px;background:var(--stone);color:var(--ink2);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.wait{background:var(--waitbg);color:var(--wait)}
.chip.ok:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ask{display:flex;gap:12px;align-items:center;background:var(--night);color:#fff;border-radius:18px;padding:14px;margin-bottom:12px;cursor:pointer}
.ask .dot{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
.ask b{display:block;font-weight:600}
.ask small{opacity:.7;font-size:12px}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border-radius:14px;overflow:hidden}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--stone)}
.ph.big img:first-child{grid-column:span 2;grid-row:span 2}
.st{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.st:last-child{border:0}
.st .n{font:600 18px/1 var(--serif);color:var(--mut);font-feature-settings:"lnum"}
.st b{font-weight:600;display:block}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:999px;background:var(--ink);color:#fff;font:600 15px var(--sans);padding:15px;margin:8px 0;cursor:pointer}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.inp{border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--mut);margin:8px 0;background:#fff}
.li{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.doc{width:40px;height:48px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:end center;padding-bottom:5px;font:700 9px var(--sans);color:var(--mut);flex:none;background:var(--stone2)}
.ava{width:40px;height:40px;border-radius:50%;background:var(--stone);display:grid;place-items:center;font:600 14px var(--serif);flex:none}
.thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none}
.cal{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;font-size:12.5px}
.cal .tr{position:relative;height:10px;background:var(--stone);border-radius:5px}
.cal .tr i{position:absolute;top:0;bottom:0;border-radius:5px;background:#C9CCD1}
.cal .tr i.f{background:var(--ink)}
.cal .now{position:absolute;top:-4px;bottom:-4px;width:1.5px;background:#E5484D}
.months{display:grid;grid-template-columns:72px repeat(3,1fr);font-size:11px;color:var(--mut);margin-bottom:6px}
.quote{border-left:2px solid var(--ink);padding:2px 0 2px 12px;margin:12px 0 4px}
.login{display:flex;flex-direction:column;min-height:100%}
.login .hd{background:var(--night) url(a/i/dom-stolovaya-m.webp) center/cover;margin:-16px -16px 18px;padding:calc(40px + env(safe-area-inset-top)) 22px 26px;color:#fff;position:relative}
.login .hd:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,19,21,.35),rgba(18,19,21,.85))}
.login .hd>*{position:relative}
.login .hd img{width:58px;height:58px}
.login h1{font:500 34px/1.05 var(--serif);margin:18px 0 6px}
.toast{position:absolute;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:5;background:var(--night);color:#fff;border-radius:18px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:center;transform:translateY(-150%);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.toast img{width:28px;height:28px}
.toast.on{transform:none}
.seg{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
.seg span{padding:8px 14px;border-radius:999px;border:1px solid var(--line);font:600 13px var(--sans);cursor:pointer;white-space:nowrap}
.seg span.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cam{border:1.5px dashed var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--mut);margin:8px 0}
.cam svg{width:30px;height:30px;margin-bottom:6px}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;margin:6px 0 2px}
.chk i{width:18px;height:18px;border:1.5px solid var(--line);border-radius:5px}
input.inp,textarea.inp,select.inp{width:100%;color:var(--ink);font:15px var(--sans);outline:none;-webkit-appearance:none;appearance:none}
input.inp:focus,textarea.inp:focus,select.inp:focus{border-color:var(--ink)}
textarea.inp{min-height:96px;resize:vertical}
.err{background:#FBE9E9;color:#9B2C2C;border-radius:12px;padding:10px 12px;font-size:13.5px;margin:6px 0}
.chip.bad{background:#FBE9E9;color:#9B2C2C}
.chip.bad:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.dot2{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:#E5484D}
.paper{border:1px solid var(--line);border-radius:14px;padding:18px 16px;background:#fff;font-size:13.5px;line-height:1.55}
.paper h4{font:600 18px/1.2 var(--serif);text-align:center;margin:0 0 4px}
.paper .c{text-align:center;color:var(--mut);font-size:12px;margin-bottom:12px}
.paper p{margin:0 0 8px}
.paper table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}
.paper td,.paper th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.paper td.r,.paper th.r{text-align:right;white-space:nowrap}
.draft{display:inline-block;font:700 10px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--wait);background:var(--waitbg);padding:5px 8px;border-radius:6px;margin-bottom:10px}
.ev{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.ev.new b{font-weight:700}
.ev .d{width:8px;height:8px;border-radius:50%;background:#E5484D;margin-top:6px;flex:none}
.ev .d.o{background:transparent}
.upl{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:8px 0}
.upl img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.lbl2{font:600 12px var(--sans);color:var(--mut);margin:12px 0 2px;display:block}
.cal .tr{cursor:pointer}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><img src="a/emblem.webp" alt=""><div><b>СК ТОР ГРУПП</b><small>Личный кабинет · прототип</small></div></div>
  <div class="role" id="roles"><button data-r="client" class="on">Клиент</button><button data-r="foreman">Прораб</button><button data-r="office">Офис</button></div>
</div>
<div class="note">Прототип для обсуждения: логика и вид экранов. Данные условные, фото с ваших объектов для примера. Всё нажимается, действия одной роли видны другой. Жёлтые метки «ждём ответ» уточняются по вашим процессам.</div>

<div class="phone">
  <div class="toast" id="toast"><img src="a/emblem-light.webp" alt=""><span></span></div>
  <div class="bar" id="bar"></div>
  <div class="scr" id="scr"></div>
  <div class="tabs" id="tabs"></div>
</div>

<script>
const V='1.5 от 01.10';
const I=n=>n.startsWith('data:')?n:`a/i/${n}-s.webp`;
const ic={
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 stages:'<path d="M4 6h16M4 12h10M4 18h6"/>',
 doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h6"/>',
 ok:'<path d="M20 6L9 17l-5-5"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',
 list:'<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',
 cam:'<path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13" r="3.5"/>',
 people:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.6-5 6.5-5s5.5 1.5 6.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5c2.5 0 4.5 1.3 5.5 4"/>',
 wait:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 exit:'<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>',
 bell:'<path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',
 msg:'<path d="M4 5h16v11H8l-4 4z"/>',
 arrow:'<path d="M9 6l6 6-6 6"/>'};
const svg=(k,c='i')=>`<svg class="${c}" viewBox="0 0 24 24">${ic[k]}</svg>`;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=()=>{const d=new Date();return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+', '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})};

/* тестовые учётные записи (только прототип) */
const USERS=[
 {login:'вадим',role:'office',name:'Вадим'},
 {login:'илья',role:'client',name:'Илья'},
 {login:'иван',role:'foreman',name:'Иван'}];
const PASS=['0000'];
const phoneDigits=t=>{let d=String(t).replace(/\D/g,'');if(d.length===11&&d[0]==='8')d='7'+d.slice(1);if(d.length===10)d='7'+d;return d};

/* данные: храним в телефоне, чтобы действия одной роли видела другая */
const KEY='tor-proto-2';
const SEED=()=>({
 stages:[
  {n:'Черновые работы',p:100,d:'1–24 окт',a:0,w:26},
  {n:'Чаша бассейна',p:100,d:'6–30 окт',a:5.4,w:26.6},
  {n:'Потолки и свет',p:70,d:'20 окт – 8 ноя',a:21,w:21},
  {n:'Электрика и слаботочка',p:40,d:'27 окт – 12 ноя',a:28.6,w:17.4},
  {n:'Полы',p:0,d:'10–20 ноя',a:44,w:11},
  {n:'Финишные работы',p:0,d:'16 ноя – 10 дек',a:50.5,w:25.5}],
 reports:[
  {st:2,t:'сегодня, 18:40',text:'Смонтировали подсветку потолка в зале. Завтра снимаем леса.',imgs:['dom-zal-lesa2','dom-zal-plitka','dom-parket'],office:false},
  {st:2,t:'вчера, 17:10',text:'Леса в зале, готовим потолок под подсветку.',imgs:['dom-zal-lesa','dom-bassejn-process'],office:false},
  {st:1,t:'30 окт, 16:00',text:'Чаша бассейна готова, гидроизоляция проверена.',imgs:['dom-bassejn-process2'],office:false},
  {st:0,t:'24 окт, 15:30',text:'Черновые работы закончены, стены готовы под отделку.',imgs:['kv-chernovaya'],office:false}],
 asks:[
  {id:1,title:'Светильники в зале бассейна',text:'Предлагаем точечные светильники в два ряда по длинной стороне, как на фото, тёплый свет 3000 K.',img:'dom-bassejn-process',st:'wait',date:'вчера, 16:20',hist:[]},
  {id:2,title:'Цвет затирки для плитки в санузле',text:'Предлагаем затирку светло-серую, под цвет плитки. Белая на полу быстро темнеет.',img:'',st:'wait',date:'сегодня, 10:05',hist:[]},
  {id:3,title:'Высота подоконников в спальне',text:'Предлагаем подоконники на высоте 85 см от чистового пола.',img:'',st:'bad',remark:'Хотим 90 см, как в гостиной.',date:'28 окт',hist:[]},
  {id:4,title:'Подсветка потолка в зале',text:'Скрытая светодиодная лента по периметру.',img:'dom-zal-lesa2',st:'ok',date:'18 окт',hist:[]},
  {id:5,title:'Отделка чаши бассейна',text:'Мозаика светло-голубая.',img:'dom-bassejn-process2',st:'ok',date:'8 окт',hist:[]}],
 docs:[
  {id:'dog',e:'PDF',n:'Договор подряда',t:'12 сент'},
  {id:'sm',e:'XLS',n:'Смета',t:'12 сент'},
  {id:'ds',e:'PDF',n:'Дополнительное соглашение №1',t:'3 окт'},
  {id:'akt',e:'PDF',n:'Акт: черновые работы',t:'25 окт'}],
 events:[
  {to:'client',text:'Прораб загрузил 3 фото: потолки и свет',t:'сегодня, 18:40',read:false},
  {to:'client',text:'Новый вопрос на согласование: цвет затирки',t:'сегодня, 10:05',read:false},
  {to:'office',text:'Клиент написал замечание: высота подоконников',t:'28 окт',read:false}],
 objs:[
  {n:'Загородный дом',a:'210 м²',f:'Иван',c:'Илья',im:'dom-holl',main:true},
  {n:'Квартира',a:'64 м²',f:'Прораб 2',c:'Клиент 2',im:'kv-koridor',p:18,s:'Черновые работы'},
  {n:'Квартира',a:'88 м²',f:'Иван',c:'Клиент 3',im:'dom-parket',p:60,s:'Полы'}],
 staff:[{n:'Иван',r:'прораб',ph:'',on:true},{n:'Прораб 2',r:'прораб',ph:'',on:true},{n:'Вадим',r:'руководитель',ph:'',on:true}],
 clients:[{n:'Илья',o:'Загородный дом',on:true},{n:'Клиент 2',o:'Квартира 64 м²',on:true},{n:'Клиент 3',o:'Квартира 88 м²',on:true}]
});
let DB;try{DB=JSON.parse(localStorage.getItem(KEY))}catch(_){}
if(!DB||!DB.stages)DB=SEED();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(_){toast('Память телефона заполнена, старые фото не сохранятся')}};
const pct=()=>Math.round(DB.stages.reduce((s,x)=>s+x.p,0)/DB.stages.length);
const cur=()=>DB.stages.find(x=>x.p>0&&x.p<100)||DB.stages.find(x=>x.p<100)||DB.stages[DB.stages.length-1];
const notify=(to,text)=>{DB.events.unshift({to,text,t:now(),read:false});save()};

 <div class="cal">${DB.stages.map((s,i)=>`<div>${s.n.split(' ')[0]}</div><div class="tr" data-go="stage:${i}"><i style="left:${s.a}%;width:${s.w}%"></i><i class="f" style="left:${s.a}%;width:${s.w*s.p/100}%"></i>${i===0?'<span class="now" style="left:34%"></span>':''}</div>`).join('')}</div>

  if(!role&&key!=='login'&&key!=='reset')key='login';
  const [k,arg]=key.split(':');const go=k==='home'?HOME[role]:k;
  const v=S[go](arg!==undefined?(isNaN(+arg)?arg:+arg):undefined);if(push)stack.push(key);
  const canBack=v.back&&stack.length>1;
  const bar=document.getElementById('bar');bar.style.display=v.noBar?'none':'';
  bar.innerHTML=(canBack?'<button class="back" id="back">‹</button>':'<img class="logo" src="a/emblem.webp" alt="">')+`<div class="t">${v.t||''}</div>`+(v.bell?`<div class="bell click" data-go="events">${svg('bell','i')}${unread()?'<i></i>':''}</div>`:'')+(!canBack&&!v.noBar?`<div class="ex" data-exit title="Выйти">${svg('exit','i')}</div>`:'');
  const sc=document.getElementById('scr');sc.innerHTML=v.h;sc.scrollTop=0;
  const tabs=role?TABS[role]:[];
  document.getElementById('tabs').innerHTML=v.noTabs||!tabs.length?'':tabs.map(([t,n,i])=>`<button data-tab="${t}" class="${v.tab===t?'on':''}">${svg(i,'')}${n}</button>`).join('');
  const lf=document.getElementById('loginForm');if(lf)lf.onsubmit=e=>{e.preventDefault();login(document.getElementById('lg').value,document.getElementById('pw').value)};
  const uf=document.getElementById('upFiles');if(uf)uf.onchange=async e=>{keepUpload();for(const f of e.target.files){try{draftImgs.push(await squeeze(f))}catch(_){toast('Не получилось прочитать фото')}}render(stack[stack.length-1],false)};
  const df=document.getElementById('docFile');if(df)df.onchange=e=>{const f=e.target.files[0];if(!f)return;DB.docs.push({id:'u'+Date.now(),e:(f.name.split('.').pop()||'').toUpperCase().slice(0,4),n:f.name,t:now(),by:'офис'});notify('client','Новый документ: '+f.name);toast('Документ загружен, клиент получил уведомление')};
}
function login(l,p){
  const raw=String(l).trim().toLowerCase();
  const u=PASS.includes(String(p).trim())?USERS.find(x=>x.login===raw):null;
  if(!u){form.err='Неверное имя или пароль';render('login',false);return}
  form={};user=u;role=u.role;document.querySelectorAll('[data-r]').forEach(b=>b.classList.toggle('on',b.dataset.r===role));stack=[];render('home');
}
function quick(r){const u=USERS.find(x=>x.role===r);login(u.login,PASS[0])}
async function squeeze(file){const url=URL.createObjectURL(file);const img=new Image();img.src=url;await img.decode();const k=Math.min(1,900/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);return c.toDataURL('image/jpeg',.7)}
function keepUpload(){const st=document.getElementById('upSt'),tx=document.getElementById('upText'),of=document.getElementById('upOff');if(st)form.st=+st.value;if(tx)form.text=tx.value;if(of)form.off=of.checked}
function toast(t){const e=document.getElementById('toast');e.querySelector('span').textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2800)}
const val=id=>(document.getElementById(id)?.value||'').trim();
function act(cmd){
  const [c,arg]=cmd.split(':');const a=DB.asks.find(x=>x.id===+arg);const here=()=>render(stack[stack.length-1],false);
  if(c==='approve'){a.st='ok';a.date=now();notify('office','Клиент согласовал: '+a.title);toast('Согласовано. Офис получил уведомление');form={};here()}
  else if(c==='openremark'){form.remark=1;here();document.getElementById('remark')?.focus()}
  else if(c==='cancelremark'){form={};here()}
  else if(c==='remark'){const t=val('remark');if(!t){toast('Напишите, что не так');return}a.st='bad';a.remark=t;a.date=now();notify('office','Клиент не согласовал: '+a.title);toast('Замечание отправлено менеджеру');form={};here()}
  else if(c==='openvariant'){form.variant=1;here();document.getElementById('variant')?.focus()}
  else if(c==='variant'){const t=val('variant');if(!t){toast('Опишите новый вариант');return}a.hist.push('Было замечание: '+a.remark);a.text=t;a.st='wait';a.remark='';a.date=now();notify('client','Новый вариант на согласование: '+a.title);toast('Новый вариант ушёл клиенту');form={};here()}
  else if(c==='remind'){notify('client','Напоминание: ждём вашего решения по «'+a.title+'»');toast('Клиенту ушло напоминание')}
  else if(c==='done'){const s=DB.stages[+arg];s.p=100;notify('client','Этап «'+s.n+'» готов');notify('office','Прораб закрыл этап «'+s.n+'»');const nx=DB.stages.find(x=>x.p===0);if(nx)nx.p=5;save();toast('Этап отмечен готовым. Клиент и офис получили уведомление');here()}
  else if(c==='send'){keepUpload();if(!draftImgs.length&&!form.text){toast('Добавьте фото или комментарий');return}const st=form.st??DB.stages.indexOf(cur());DB.reports.unshift({st,t:now(),text:form.text||'',imgs:draftImgs.slice(),office:!!form.off});
    if(!form.off)notify('client','Прораб загрузил '+(draftImgs.length?draftImgs.length+' фото: ':'отчёт: ')+DB.stages[st].n.toLowerCase());notify('office','Фотоотчёт по этапу «'+DB.stages[st].n+'»');
    save();draftImgs=[];form={};toast(navigator.onLine?'Отправлено':'Нет связи: фото подождут и уйдут сами');stack.pop();render('fobj',false)}
  else if(c==='newobj'){const n=val('noN');if(!n){toast('Введите название');return}DB.objs.push({n,a:(val('noA')||'?')+' м²',f:val('noF'),c:val('noC')||'клиент',im:'kv-koridor',p:0,s:'подготовка'});save();toast('Объект создан, этапы из шаблона');stack.pop();render('office',false)}
  else if(c==='newask'){const t=val('naT');if(!t){toast('Напишите, что согласовать');return}DB.asks.unshift({id:Date.now(),title:t,text:val('naX')||'',img:'',st:'wait',date:now(),hist:[]});notify('client','Новый вопрос на согласование: '+t);toast('Отправлено клиенту');stack.pop();here()}
  else if(c==='staff'){const p=DB.staff[+arg];p.on=!p.on;save();toast(p.on?'Сотрудник снова может входить':'Отключён. Фото и объекты остались');here()}
  else if(c==='addstaff'){const n=val('npN');if(!n){toast('Введите имя');return}DB.staff.push({n,r:val('npR'),ph:val('npP'),on:true});save();toast('Приглашение отправлено на телефон');here()}
  else if(c==='addclient'){const n=val('ncN');if(!n){toast('Введите имя');return}DB.clients.push({n,o:val('ncO'),on:true});save();toast('Клиент добавлен, доступ ушёл на почту');here()}
}
document.addEventListener('click',e=>{
  if(e.target.closest('#back')){form={};stack.pop();render(stack[stack.length-1]||HOME[role],false);return}
  if(e.target.closest('[data-reload]')){e.preventDefault();location.replace(location.pathname+'?v='+Date.now());return}
  if(e.target.closest('[data-resetdb]')){e.preventDefault();DB=SEED();save();toast('Тестовые данные сброшены');return}
  if(e.target.closest('[data-exit]')){role=null;user=null;form={};stack=[];render('login');return}
  const sg=e.target.closest('[data-seg]');if(sg){seg=sg.dataset.seg;render('people',false);return}
  const L=e.target.closest('[data-login]');if(L){quick(L.dataset.login);return}
  const d=e.target.closest('[data-do]');if(d){e.preventDefault();e.stopPropagation();act(d.dataset.do);return}
  const a=e.target.closest('[data-act]');if(a){toast(a.dataset.act);return}
  const g=e.target.closest('[data-go]');if(g){if(g.dataset.go==='upload')draftImgs=[];render(g.dataset.go);return}
  const t=e.target.closest('[data-tab]');if(t&&role){stack=[];render(t.dataset.tab);return}
  const r=e.target.closest('[data-r]');if(r){quick(r.dataset.r)}
});
document.addEventListener('change',e=>{if(e.target.id==='upSt'||e.target.id==='upOff')keepUpload()});
render('login');
</script>
</body>
</html>
